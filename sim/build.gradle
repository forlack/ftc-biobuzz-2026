plugins {
    id 'application'
}

repositories {
    mavenCentral()
    maven { url = "https://repo.dairy.foundation/releases/" } // Pedro Pathing core
}

dependencies {
    implementation 'com.pedropathing:core:3.0.1'
    implementation 'org.json:json:20240303'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// The simulator compiles the robot's own plain-Java code from TeamCode, so what it tests is
// what runs on the robot: the dashboard server, settings, actions, routes and AutoSequence.
sourceSets {
    main {
        java {
            srcDirs = ['src/main/java', '../TeamCode/src/main/java']
            include 'org/biobuzz/sim/**'
            include 'org/firstinspires/ftc/teamcode/dashboard/**'
            include 'org/firstinspires/ftc/teamcode/lib/RobotFiles.java'
            include 'org/firstinspires/ftc/teamcode/lib/RobotHistory.java'
            include 'org/firstinspires/ftc/teamcode/lib/RobotSettings.java'
            include 'org/firstinspires/ftc/teamcode/lib/Actions.java'
            include 'org/firstinspires/ftc/teamcode/lib/StandardActions.java'
            include 'org/firstinspires/ftc/teamcode/lib/Mechanisms.java'
            include 'org/firstinspires/ftc/teamcode/lib/AutoSequence.java'
            include 'org/firstinspires/ftc/teamcode/lib/AutoRoute.java'
            include 'org/firstinspires/ftc/teamcode/lib/FlywheelCompensation.java'
            include 'org/firstinspires/ftc/teamcode/lib/Button.java'
            include 'org/firstinspires/ftc/teamcode/pedro/ForesightConstants.java'
        }
    }
}

application {
    mainClass = 'org.biobuzz.sim.SimMain'
}

tasks.named('run') {
    workingDir = rootProject.projectDir
    standardInput = System.in
}

// Settings classes: every TeamCode class marked @Configurable, found in the sources, the same
// way the robot finds them in the app. Robot-only classes get a mirror here with the real
// class's simple name and every public static setting (generated from the real source, so
// they can never drift); classes the simulator compiles itself (dashboard/) are used as they
// are. ConfigurableClasses.ALL lists them all. One robot.json works on the robot and here.
def teamCode = file('../TeamCode/src/main/java')
def mirrorDir = layout.buildDirectory.dir('generated/mirror')

tasks.register('generateMirrors') {
    inputs.dir(teamCode)
    outputs.dir(mirrorDir)
    doLast {
        def folder = mirrorDir.get().dir('org/biobuzz/sim/mirror').asFile
        folder.deleteDir()
        folder.mkdirs()
        def field = ~/^\s*public static (double|float|int|long|boolean|String) ([A-Z0-9_]+)\s*=\s*([^;]+);/
        def classes = []
        fileTree(teamCode).matching { include '**/*.java' }.sort { it.path }.each { source ->
            def lines = source.readLines()
            if (!lines.any { it.trim() == '@Configurable' }) return
            def name = source.name - '.java'
            def relative = teamCode.toPath().relativize(source.toPath()).toString().replace('\\', '/')
            if (relative.startsWith('org/firstinspires/ftc/teamcode/dashboard/')) {
                classes << (relative - '.java').replace('/', '.') + '.class'
                return
            }
            def body = new StringBuilder()
            lines.eachWithIndex { line, i ->
                def m = line =~ field
                if (m.find()) {
                    def liveOnly = i > 0 && lines[i - 1].contains('@RobotSettings.NotSaved')
                    if (liveOnly) body << '    @RobotSettings.NotSaved\n'
                    body << "    public static ${m.group(1)} ${m.group(2)} = ${m.group(3)};\n"
                }
            }
            def hidden = lines.any { it.trim().startsWith('@Configurable.Hidden') } ? '@org.firstinspires.ftc.teamcode.dashboard.Configurable.Hidden\n' : ''
            new File(folder, "${name}.java").text = """package org.biobuzz.sim.mirror;

import org.firstinspires.ftc.teamcode.lib.RobotSettings;

/** GENERATED from TeamCode/src/main/java/${relative} by sim/build.gradle. Do not edit. */
${hidden}public final class ${name} {
${body}}
"""
            classes << "${name}.class"
        }
        new File(folder, 'ConfigurableClasses.java').text = """package org.biobuzz.sim.mirror;

/** GENERATED by sim/build.gradle: every @Configurable class in TeamCode. Do not edit. */
public final class ConfigurableClasses {
    private ConfigurableClasses() { }

    public static final Class<?>[] ALL = {
        ${classes.join(',\n        ')}
    };
}
"""
    }
}
sourceSets.main.java.srcDir(mirrorDir)
tasks.named('compileJava') { dependsOn 'generateMirrors' }
