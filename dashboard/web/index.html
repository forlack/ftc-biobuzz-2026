<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioBuzz Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%23f5b301'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/uPlot.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2l12 7v14l-12 7-12-7V9z"/></svg>
      <div>
        <div class="brand-name">BioBuzz</div>
        <div class="brand-sub" id="robot-name">connecting…</div>
      </div>
      <span class="badge sim" id="sim-badge" hidden>SIMULATOR</span>
    </div>

    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="live" class="active">Live</button>
      <button role="tab" data-tab="tune">Tune</button>
      <button role="tab" data-tab="paths">Paths</button>
      <button role="tab" data-tab="robot">Robot</button>
    </nav>

    <div class="opbar">
      <select id="op-select" aria-label="OpMode"></select>
      <button class="btn" id="op-init">Init</button>
      <button class="btn primary" id="op-start">Start</button>
      <button class="btn danger" id="op-stop">Stop</button>
      <span class="pill" id="op-state">stopped</span>
      <span class="pill" id="battery">— V</span>
      <span class="conn" id="conn" title="Connection"><i></i><span>offline</span></span>
    </div>
  </header>

  <main>
    <!-- LIVE -->
    <section class="tab-page active" id="tab-live">
      <div class="toolbar">
        <div class="seg" id="window-seg">
          <button data-window="5">5 s</button>
          <button data-window="10" class="active">10 s</button>
          <button data-window="30">30 s</button>
          <button data-window="60">60 s</button>
        </div>
        <button class="btn" id="pause">Pause</button>
        <button class="btn" id="export-csv">Export CSV</button>
        <span class="muted" id="rate"></span>
      </div>
      <div class="live-grid">
        <div class="charts" id="charts"></div>
        <aside class="side">
          <div class="card">
            <div class="card-head"><h3>Field</h3><span class="muted" id="pose-text"></span></div>
            <canvas id="field" width="480" height="480"></canvas>
          </div>
          <div class="card grow">
            <div class="card-head">
              <h3>Telemetry</h3>
              <input id="telemetry-filter" placeholder="Filter" aria-label="Filter telemetry">
            </div>
            <table class="kv" id="telemetry"></table>
          </div>
        </aside>
      </div>
    </section>

    <!-- TUNE -->
    <section class="tab-page" id="tab-tune">
      <div class="toolbar">
        <button class="btn primary" id="settings-save">Save to robot</button>
        <button class="btn" id="settings-reload">Reload from robot</button>
        <button class="btn" id="settings-download">Download robot.json</button>
        <span class="status" id="settings-status"></span>
      </div>
      <div id="settings-warnings"></div>
      <p class="hint">Changes apply on the robot right away. <b>Save to robot</b> keeps them after a restart;
        <code>./robot-sync pull</code> then copies robot.json into Git.</p>
      <div class="settings" id="settings"></div>
    </section>

    <!-- PATHS -->
    <section class="tab-page" id="tab-paths">
      <iframe id="visualizer" title="Path editor" data-src="visualizer/index.html"></iframe>
      <div class="empty" id="visualizer-missing" hidden>
        The path editor is not built yet. Run <code>./build-visualizer</code>.
      </div>
    </section>

    <!-- ROBOT -->
    <section class="tab-page" id="tab-robot">
      <div class="robot-grid">
        <div class="card">
          <div class="card-head"><h3>Hardware map</h3><span class="muted" id="hw-name"></span></div>
          <div id="hardware"></div>
        </div>
        <div class="card">
          <div class="card-head"><h3>Files on the robot</h3><button class="btn small" id="files-refresh">Refresh</button></div>
          <table class="files" id="files"></table>
          <div id="editor" hidden>
            <div class="card-head"><h3 id="editor-name"></h3>
              <span>
                <button class="btn small" id="editor-cancel">Close</button>
                <button class="btn small primary" id="editor-save">Save to robot</button>
              </span>
            </div>
            <textarea id="editor-text" spellcheck="false"></textarea>
            <div class="status" id="editor-status"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
  <script src="vendor/uPlot.iife.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
