apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
}

// Pedro AutoTune runs a web server (port 10158) as soon as its library is in the app, and
// that server has crashed the Robot Controller at boot. Competition builds leave it out.
// Build with -Ptuning (./deploy-linux --tuning) to include it and the src/tuning tuners.
// The Total Chaos Dashboard (port 8686) is in every build on this branch; it replaces Panels.
// Its page comes from ../dashboard/web, packed into the app as assets/biobuzz/.
// (-Pdashboard / --dashboard are still accepted and change nothing.)
def dashboardAssets = "${buildDir}/generated/biobuzz-assets"
def copyDashboard = tasks.register('copyTotalChaosDashboard', Sync) {
    from '../dashboard/web'
    into "${dashboardAssets}/biobuzz"
}
android.sourceSets.main.java.srcDirs += 'src/dashboard/java'
android.sourceSets.main.assets.srcDirs += dashboardAssets
tasks.named('preBuild') { dependsOn copyDashboard }

// Settings: every TeamCode class marked @Configurable, listed at build time (no scanning on
// the robot). RobotSettings reads the generated ConfigurableClasses.ALL; the simulator's build
// makes its own list the same way.
def configurableDir = "${buildDir}/generated/configurable"
def listConfigurables = tasks.register('generateConfigurableList') {
    def sources = file('src/main/java')
    inputs.dir(sources)
    outputs.dir(configurableDir)
    doLast {
        def classes = []
        fileTree(sources).matching { include '**/*.java' }.sort { it.path }.each { source ->
            if (source.readLines().any { it.trim() == '@Configurable' }) {
                def relative = sources.toPath().relativize(source.toPath()).toString().replace('\\', '/')
                classes << (relative - '.java').replace('/', '.') + '.class'
            }
        }
        def out = file("${configurableDir}/org/firstinspires/ftc/teamcode/generated/ConfigurableClasses.java")
        out.parentFile.mkdirs()
        out.text = """package org.firstinspires.ftc.teamcode.generated;

/** GENERATED by TeamCode/build.gradle: every @Configurable class in TeamCode. Do not edit. */
public final class ConfigurableClasses {
    private ConfigurableClasses() { }

    public static final Class<?>[] ALL = {
        ${classes.join(',\n        ')}
    };
}
"""
    }
}
android.sourceSets.main.java.srcDirs += configurableDir
tasks.named('preBuild') { dependsOn listConfigurables }

if (project.hasProperty('tuning')) {
    android.sourceSets.main.java.srcDirs += 'src/tuning/java'
    dependencies {
        implementation 'com.pedropathing:tuning:1.0.1'
    }
}
