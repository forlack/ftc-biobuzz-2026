apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
}

// Pedro AutoTune runs a web server (port 10158) as soon as its library is in the app, and
// that server has crashed the Robot Controller at boot. Competition builds leave it out.
// Build with -Ptuning (./deploy-linux --tuning) to include it and the src/tuning tuners.
// The BioBuzz dashboard (port 8686) starts only in builds made with -Pdashboard
// (./deploy-linux --dashboard), until it has proven itself on the robot. Its page comes
// from ../dashboard/web.
// The page is packed as assets/biobuzz/: Panels already uses assets/web/, and an app asset
// with the same path would replace Panels' own page.
if (project.hasProperty('dashboard')) {
    def dashboardAssets = "${buildDir}/generated/biobuzz-assets"
    def copyDashboard = tasks.register('copyBioBuzzDashboard', Sync) {
        from '../dashboard/web'
        into "${dashboardAssets}/biobuzz"
    }
    android.sourceSets.main.java.srcDirs += 'src/dashboard/java'
    android.sourceSets.main.assets.srcDirs += dashboardAssets
    tasks.named('preBuild') { dependsOn copyDashboard }
}

if (project.hasProperty('tuning')) {
    android.sourceSets.main.java.srcDirs += 'src/tuning/java'
    dependencies {
        implementation 'com.pedropathing:tuning:1.0.1'
    }
}
